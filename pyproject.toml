[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ekans"
version = "0.1.0"
description = "A pure functional experiment in Python."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [
    { name = "Justin Termaat" },
]
dependencies = [
    "toolz",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "mypy",
    "black",
    "flake8",
    "isort",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ekans"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ekans --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["ekans"]

[tool.isort]
profile = "black"
